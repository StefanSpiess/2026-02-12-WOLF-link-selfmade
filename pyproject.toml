[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-smartset-logger"
version = "0.1.0"
description = "Python library and CLI tools for Wolf Smartset heating systems"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["wolf", "smartset", "heating", "home-automation", "iot"]
authors = [
    {name = "Stefan Spiess"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/stefanspiess/wolf-smartset-logger"
Issues = "https://github.com/stefanspiess/wolf-smartset-logger/issues"
Repository = "https://github.com/stefanspiess/wolf-smartset-logger"

[project.scripts]
wolf-logger = "wolf_smartset.cli.logger:main"
wolf-query = "wolf_smartset.cli.query:main"
wolf-export = "wolf_smartset.cli.export:main"

[tool.setuptools]
packages = ["wolf_smartset", "wolf_smartset.cli"]

[tool.setuptools.package-data]
wolf_smartset = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
